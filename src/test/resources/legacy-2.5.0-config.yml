# OreVeins 2.3 for Paper/Purpur 26.2
#
# An empty enabled-worlds list enables every NORMAL and NETHER world. New chunks
# are handled during generation; existing chunks can be retrofitted once per
# retrofit-version when loaded. replace-existing-ores removes the generator's
# original ores first.
# This is required for Iris worlds, otherwise both ore sets would stack.
settings:
  enabled-worlds: []
  replace-existing-ores: true
  # Existing chunks are converted once per retrofit-version when loaded. The
  # marker is stored in the chunk itself, so later visits do not repeat it.
  retrofit-existing-chunks: true
  # Number of 16-block-high chunk sections handled per tick (1 is safest).
  retrofit-sections-per-tick: 1
  retrofit-version: 2

# Y coordinates below match the server's Iris overworld and Iris Nether. The
# Nether spans Y -256..511. Values are proportionally scaled only when another
# world uses different min/max heights, then clamped to its real build limits.
reference-heights:
  NORMAL:
    min-y: -256
    max-y: 512
  NETHER:
    min-y: -256
    max-y: 512

# All ordinary ore sizes stay exactly 3x vanilla/Ore-Control defaults. Overworld
# attempt counts remain at 30% of the previous frequency. Nether attempts are
# doubled from the previous OreVeins values. Fractional counts are rolled
# probabilistically per chunk.
veins:
  - id: coal-upper
    environment: NORMAL
    material: COAL_ORE
    deepslate-material: DEEPSLATE_COAL_ORE
    replace: OVERWORLD_BASE
    attempts-per-chunk: 4.5
    size: 51
    min-y: 144
    max-y: 511
    distribution: UNIFORM

