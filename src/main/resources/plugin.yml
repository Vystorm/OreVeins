name: OreVeins
version: '${version}'
main: com.icloud.kevinmendoza.oreveins.OreVeinsPlugin
description: Configurable ore vein generation for Paper and Purpur 26.2 worlds.
authors: [Kevin Mendoza, Esoren]
website: https://github.com/Vystorm/OreVeins
api-version: '26.2'
load: STARTUP
# Optional: Vystorm Core 0.24.0+ adds a web page (ore guide and admin panel).
softdepend: [vystorm_core]
commands:
  oreveins:
    description: Lädt OreVeins neu, zeigt Status/Statistik und erzeugt Erzadern in Chunks gezielt neu.
    usage: /oreveins <reload|status|stats [Welt]|simulate|history|failed|retry [confirm]|validate|compare|web|regenerate <all|cancel|loaded|preview|Radius|chunk Welt x z>>
    permission: oreveins.admin
permissions:
  oreveins.*:
    description: Alle OreVeins-Rechte
    default: op
    children:
      oreveins.admin: true
  oreveins.admin:
    description: OreVeins-Verwaltung (alle /oreveins-Befehle, Admin-Bereich der Web-Seite, Fortschrittsmeldungen)
    default: op
