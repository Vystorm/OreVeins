failures:
  summary: "Failed chunks: {count}; processing paused by storage failure: {blocked}. Showing at most 30."
  row: "{world} chunk {x},{z}: {reason}; failed attempts: {attempts}"
  confirm: "Retry replaces ores/lava again only in the recorded failed chunks, including partly processed chunks. It is not an undo. Use /oreveins retry confirm to queue at most 100."
  queued: "Queued {count} failed chunks for retry. Successfully processed chunks were not added."

maintenance:
  status: "Maintenance window enabled: {enabled}; UTC {start}–{end}; allowed now: {allowed}; budget: {budget} ms/tick; new chunks/min: {rate} (0 = unlimited)."

region-preview:
  busy: "A region preview is running or the 30-second cooldown is still active."
  started: "Reading existing region files. No chunks are loaded or changed. Cancel: /oreveins regenerate preview cancel"
  cancelled: "Region preview stopped. This does not cancel a regeneration campaign."
  world: "{world}: build height {min}..{max}, up to {sections} removal sections plus generation per chunk."
  result: "Preview: {chunks} occupied chunk entries in {files} region files; {errors} read errors. This is not a world snapshot: duplicate region locations, concurrent saves and invalid chunk payloads may change the actual work."
  error: "Read error: {detail}"

simulation-distribution:
  row: "{ore}: per chunk min {min}, max {max}, mean {mean}, population standard deviation {stddev}; {samples} seeds (missing ores = 0)."
  note: "Synthetic write counts: not a world forecast, confidence claim, or measured connected vein size."

exclusions:
  status: "Excluded building areas: {areas}; chunks skipped since startup: {skipped}."

history:
  header: "Last 15 regeneration runs (local, up to 100 stored). History available: {available}. This is not a retry checkpoint."
  row: "{id} | {actor} | {scope} | {started}–{ended} | {status}: queued {queued}, completed {completed}, failed {failed}, skipped {skipped}, cancelled {cancelled}"

simulation-connected:
  row: "{ore}: {count} connected components; min {min}, max {max}, median {median} blocks."
  note: "Six-face adjacency per material and synthetic chunk. Chunk boundaries truncate components; adjacent veins may merge. Not a world prediction."
