# OreVeins for Paper/Purpur 26.2 - default configuration (vanilla worlds)
#
# Tuned for vanilla-generated worlds: overworld Y -64..319, Nether Y 0..255 and
# vanilla biome keys. Other presets (for example tall Iris worlds) are written
# to plugins/OreVeins/presets/ on every start; copy one over this file to use it.
#
# Do not remove config-version: files without it are treated as OreVeins 2.5.0
# (or older) configs and take their missing keys from the tall Iris preset.
config-version: 1

# Message language: auto = German for players whose client language is German,
# English for everyone else and for the console. en / de force one language
# everywhere (console included). Single texts can be overridden by creating
# plugins/OreVeins/lang/en.yml or lang/de.yml with just the keys to change.
language: auto

settings:
  # World names to handle. An empty list enables every NORMAL and NETHER world.
  enabled-worlds: []
  # Removes the ores the world generator placed before the configured veins are
  # generated, so both ore sets do not stack. Removed ores are filled with the
  # most common neighbouring block (stone, deepslate, tuff, granite, ...).
  replace-existing-ores: true
  # When true, chunks that already existed before OreVeins was installed are
  # converted once per retrofit-version when they are loaded: all ore blocks
  # (including ore blocks players placed!) and the deep source lava of the
  # deep-lava pass are removed and regenerated. Make a backup first. Chunks
  # generated while OreVeins is active are never retrofitted again.
  retrofit-existing-chunks: false
  # Number of 16-block-high chunk sections handled per tick (1..8, 1 is safest).
  retrofit-sections-per-tick: 1
  # Raise this only on purpose: a higher number makes every chunk eligible for
  # one more retrofit pass.
  retrofit-version: 1

# Heights the vein Y values below are written for. When a world has other
# min/max heights, the Y values are scaled proportionally and then clamped to
# the world's real build limits. max-y is exclusive (world top + 1).
reference-heights:
  NORMAL:
    min-y: -64
    max-y: 320
  NETHER:
    min-y: 0
    max-y: 256

# Vein passes. Each vein uses 3x the vanilla vein size, and the attempts are
# set so every ore ends up at roughly the vanilla amount of blocks per chunk:
# about a third as many deposits, each much larger, which rewards exploring and
# caving over strip mining. Y ranges follow vanilla and are clamped to the
# world's build limits before a height is picked.
#
# Keys per pass:
#   id                        unique name
#   environment               NORMAL or NETHER
#   material                  block to place
#   deepslate-material        optional; used when the host block is deepslate/tuff
#   replace                   OVERWORLD_BASE (stone, deepslate, tuff, granite,
#                             diorite, andesite), NETHER_BASE (netherrack,
#                             basalt, blackstone) or NETHERRACK
#   attempts-per-chunk        may be fractional; the fraction is rolled per chunk
#   spawn-chance              optional chance (0..1) per attempt, default 1
#   size                      target number of blocks per vein
#   min-y / max-y             range in reference-heights coordinates
#   distribution              UNIFORM or TRIANGLE (peak in the middle)
#   discard-on-air-exposure   optional chance (0..1) to skip a block touching air
#   biomes                    optional list of biome keys (e.g. minecraft:badlands)
veins:
  - id: coal-upper
    environment: NORMAL
    material: COAL_ORE
    deepslate-material: DEEPSLATE_COAL_ORE
    replace: OVERWORLD_BASE
    attempts-per-chunk: 1.6
    size: 51
    min-y: 136
    max-y: 319
    distribution: UNIFORM

  - id: coal-lower
    environment: NORMAL
    material: COAL_ORE
    deepslate-material: DEEPSLATE_COAL_ORE
    replace: OVERWORLD_BASE
    attempts-per-chunk: 1.05
    size: 51
    min-y: 0
    max-y: 192
    distribution: TRIANGLE
    discard-on-air-exposure: 0.5

